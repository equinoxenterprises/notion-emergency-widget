<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Fund Widget</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: TimesNewRoman, "Times New Roman", Times, Baskerville, Georgia, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .widget-card {
            background: linear-gradient(135deg, #2b221e 0%, #1a1412 100%);
            color: #dfc8b4;
            width: 100%;
            max-width: 380px;
            aspect-ratio: 16 / 9;
            padding: 24px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            box-sizing: border-box;
            border: 1px solid rgba(223, 200, 180, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .icon-container {
            font-size: 24px;
            margin-bottom: 6px;
            display: inline-block;
            animation: pulseIcon 2s infinite ease-in-out;
        }

        .widget-title {
            font-size: 32px;
            font-weight: normal;
            margin: 0 0 6px 0;
            letter-spacing: 1px;
            color: #dfc8b4;
            line-height: 1.1;
        }

        .widget-subtitle {
            font-size: 11.5px;
            color: #b5a494;
            margin: 0;
            line-height: 1.4;
        }

        @keyframes pulseIcon {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="widget-card">
        <div id="dynamic-icon" class="icon-container">🛡️</div>
        <div class="widget-title">3-6 Months</div>
        <div class="widget-subtitle">Safety Net Check: Is your emergency fund locked and secured today?</div>
    </div>

    <script>
        const icons = ["🛡️", "🔒", "🔐", "☂️"];
        let currentIndex = 0;

        const iconElement = document.getElementById("dynamic-icon");

        setInterval(() => {
            currentIndex = (currentIndex + 1) % icons.length;
            iconElement.style.opacity = 0;
            setTimeout(() => {
                iconElement.textContent = icons[currentIndex];
                iconElement.style.opacity = 1;
            }, 200);
        }, 3000);

        iconElement.style.transition = "opacity 0.2s ease-in-out";
    </script>

</body>
</html>
